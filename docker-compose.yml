version: '3.8'

services:
  web:
    build: .
    container_name: fastapi_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./task_master.db:/app/task_master.db  # Persists your SQLite database
      - ./uploads:/app/uploads                # Persists uploaded files
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
 